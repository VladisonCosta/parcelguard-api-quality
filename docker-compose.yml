services:
  api:
    build: .
    ports: ["8001:8001"]
    environment:
      PARCELGUARD_DB_PATH: /service/data/parcelguard.sqlite3
    volumes:
      - parcelguard_data:/service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  parcelguard_data:

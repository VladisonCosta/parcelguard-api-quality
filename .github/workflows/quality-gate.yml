name: API Quality Gate | Contract + Business + Concurrency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Execute QA suite + coverage gate
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=test-results.xml
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcelguard-api-qa-evidence
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
